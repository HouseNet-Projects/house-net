name: HouseNet design system CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    uses: HouseNet-Projects/house-net-control-plane/.github/workflows/reusable-policy-gate.yml@9ac18853389424794c23aaee72f1d9a859b24c16
  design-system:
    name: Design system integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate tokens, provenance and bilingual documents
        run: python validators/validate_design_system.py .
      - name: Check version surfaces
        run: bin/check-version-consistency .
      - name: Run design-system tests
        run: python -m unittest discover -s tests -q
      - name: Check Python syntax
        run: python -m py_compile validators/validate_design_system.py tests/test_design_system.py
