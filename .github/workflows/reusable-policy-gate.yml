name: HouseNet policy gate
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-gate:
    name: HouseNet repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject non-HouseNet callers
        env:
          CALLER: ${{ github.repository }}
        run: |
          case "$CALLER" in HouseNet-Projects/*) ;; *) exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate against immutable HouseNet authority
        uses: HouseNet-Projects/house-net-control-plane@052512927683014432c353a7e16af586d2ada3fe
