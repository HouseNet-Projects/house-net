name: HouseNet policy gate
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-gate:
    name: HouseNet repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject non-HouseNet callers
        env:
          CALLER: ${{ github.repository }}
        run: |
          case "$CALLER" in HouseNet-Projects/*) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate against immutable HouseNet authority
        uses: HouseNet-Projects/house-net-control-plane@7062f1d21bca07012b28d8e205b80c1f39082953
