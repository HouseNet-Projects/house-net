name: HouseNet monorepo CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monorepo-governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, lfs: true}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python tools/validate_house_net.py
      - run: control-plane/bin/housenet-preflight --json
      - run: |
          ! git grep -nE '(^|[^A-Za-z])(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,})' -- ':!docs/governance/MONOREPO_MIGRATION_MANIFEST.md'
  control-plane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, lfs: true}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input -q -r control-plane/requirements.txt
      - run: python control-plane/bin/validate-control-plane --json
      - run: python -m unittest discover -s control-plane/tests -v
  design-system:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {lfs: true}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python design-system/validators/validate_design_system.py design-system
      - run: python -m unittest discover -s design-system/tests -q
  knowledge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {lfs: true}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input -q -r knowledge/requirements.txt
      - run: python knowledge/bin/validate-knowledge
      - run: python -m unittest discover -s knowledge/tests -v
  vault:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {lfs: true}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input -q -r vault/requirements.txt
      - run: python vault/bin/validate-vault
      - run: python -m unittest discover -s vault/tests -v
  command-center:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, lfs: true}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - name: Install command-center runtime dependencies
        run: python -m pip install --disable-pip-version-check --no-input -q -r .claude/runtime/requirements.txt
        working-directory: command-center
      - name: Build and certify business model
        run: python .claude/business/build_business_model.py --allow-missing-sources
        working-directory: command-center
      - name: Run canonical Deputy and governance suites
        run: >-
          python -m unittest -v
          test_skills test_store test_failclosed test_enforcement test_scope
          test_business test_actions test_live_data test_intelligence
          test_architecture test_runtime_integration test_deputy_e2e
          test_hardening test_channels
        working-directory: command-center/.claude/tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          COMMAND_CENTER_TEST_MODE: '1'
  full-system:
    runs-on: ubuntu-24.04
    needs: [monorepo-governance, control-plane, design-system, knowledge, vault, command-center]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, lfs: true}
      - run: git lfs fsck
      - run: |
          python3 - <<'PY'
          import json
          with open('house-net-control.json') as f: d=json.load(f)
          assert d['repository']=='HouseNet-Projects/house-net'
          assert d['policy_version']=='1.4.3'
          PY
