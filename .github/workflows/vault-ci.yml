name: HouseNet Vault CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-gate:
    name: HouseNet policy gate
    uses: HouseNet-Projects/house-net-control-plane/.github/workflows/reusable-policy-gate.yml@15ffa9b1cc672a1c4fddcacfb823439942801c2c
  vault:
    name: Vault boundary checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate vault references
        run: python3 bin/validate-vault
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
